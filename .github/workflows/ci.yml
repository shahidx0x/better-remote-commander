name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm catalog:check
      - run: pnpm test:unit
      - run: pnpm test:agent
      - run: pnpm test:e2e
        env: { E2E_PORT: '3555', BRC_DEBUG: '1' }
      - name: pack npm tarballs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm pack:all
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with: { name: npm-tarballs, path: dist-pack/*.tgz }

  mongo-integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:mongo
        env:
          BRC_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f packages/relay/Dockerfile -t brc/relay:ci .
      - name: Verify Easypanel subfolder build context
        if: github.ref == 'refs/heads/main'
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -f packages/relay/Dockerfile -t brc/relay:easypanel-ci packages/relay
      - run: docker build -f packages/agent/Dockerfile -t brc/agent:ci .
      - name: smoke relay image
        run: |
          docker run -d --name relay -p 3000:3000 -e PUBLIC_URL=http://localhost:3000 -e BRC_ADMIN_PASSWORD=ci -e BRC_SESSION_SECRET=ci brc/relay:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs http://localhost:3000/.well-known/oauth-authorization-server | grep -q authorization_endpoint
