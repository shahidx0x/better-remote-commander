name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Ensure this is still the latest main commit
        id: gate
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --tags origin
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "Newer main commit exists; its CI run will release instead."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == "chore(release):"* ]]; then
            echo "Release-version commit; nothing to publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
      - name: Calculate next patch version
        if: steps.gate.outputs.should_release == 'true'
        id: version
        shell: bash
        run: |
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [[ -n "$latest" ]]; then
            base="${latest#v}"
          else
            base="$(node -p "require('./package.json').version")"
          fi
          IFS=. read -r major minor patch <<< "$base"
          version="$major.$minor.$((patch + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Next release: v$version"

      - name: Bump version, commit and tag
        if: steps.gate.outputs.should_release == 'true'
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/bump-version.mjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/shared/package.json packages/agent/package.json packages/relay/package.json packages/agent/src/cli.ts packages/relay/src/app.ts
          git commit -m "chore(release): $TAG [skip ci]"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  packages:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit

      - name: Publish to npm
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Build release archives
        run: node scripts/pack-release.mjs ${{ github.repository }} ${{ needs.prepare.outputs.tag }}

      - name: Bundle install scripts
        run: |
          mkdir -p dist-pack
          cp install.sh install.ps1 dist-pack/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist-pack/*

  docker:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/relay:latest
            ${{ env.IMAGE_BASE }}/relay:${{ needs.prepare.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/agent:latest
            ${{ env.IMAGE_BASE }}/agent:${{ needs.prepare.outputs.version }}

  github-release:
    needs: [prepare, packages, docker]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist-pack

      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Install"
            echo '```'
            echo "npm i -g brc-agent"
            echo "npm i -g brc-relay"
            echo
            echo "# or Docker"
            echo "docker pull ${IMAGE_BASE}/relay:$VERSION"
            echo "docker pull ${IMAGE_BASE}/agent:$VERSION"
            echo '```'
            echo "Release archives include brc-shared, brc-agent, brc-relay, and install scripts."
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist-pack/*
          body_path: notes.md
          generate_release_notes: true
          make_latest: true
