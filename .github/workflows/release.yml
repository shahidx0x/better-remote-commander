name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit
      - run: node scripts/pack-release.mjs ${{ github.repository }} ${{ github.ref_name }}
      - name: bundle install scripts
        run: |
          mkdir -p dist-pack
          cp install.sh install.ps1 dist-pack/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: release-files, path: dist-pack/* }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/relay:latest
            ${{ env.IMAGE_BASE }}/relay:${{ steps.tags.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/agent:latest
            ${{ env.IMAGE_BASE }}/agent:${{ steps.tags.outputs.version }}

  github-release:
    runs-on: ubuntu-latest
    needs: [packages, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-files, path: dist-pack }
      - name: release notes
        run: |
          {
            echo "## Install"
            echo '```'
            echo "# agent (machine to control)"
            echo "npm i -g https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(ls dist-pack | grep rdp-agent)"
            echo "# relay (server)"
            echo "npm i -g https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(ls dist-pack | grep rdp-relay)"
            echo "# or docker"
            echo "docker pull ${IMAGE_BASE}/relay:${GITHUB_REF_NAME#v}"
            echo '```'
            echo "Install the shared package first if npm cannot resolve it: $(ls dist-pack | grep rdp-shared)"
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-pack/*
          body_path: notes.md
          generate_release_notes: true
